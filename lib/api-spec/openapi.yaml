openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: API specification for 偶然の6人
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: events
  - name: participations
  - name: reports
  - name: likes
  - name: users
  - name: notifications
  - name: feedbacks
  - name: office

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [new, near, seats]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update event (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete event (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /events/{id}/apply:
    post:
      operationId: applyToEvent
      tags: [participations]
      summary: Apply to event (first-come-first-served)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        "201":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "400":
          description: Full or already applied
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /events/{id}/cancel:
    post:
      operationId: cancelParticipation
      tags: [participations]
      summary: Cancel participation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
        "400":
          description: Cannot cancel
        "401":
          description: Unauthorized

  /events/{id}/participants:
    get:
      operationId: listEventParticipants
      tags: [participations]
      summary: List event participants (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParticipantInfo"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /events/{id}/reports:
    get:
      operationId: listEventReports
      tags: [reports]
      summary: List reports for event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Create report (participant impression or host report)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /reports/{id}/like:
    post:
      operationId: likeReport
      tags: [likes]
      summary: Toggle like on a report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "401":
          description: Unauthorized

  /my/applications:
    get:
      operationId: listMyApplications
      tags: [participations]
      summary: My participations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationWithEvent"
        "401":
          description: Unauthorized

  /my/hosted-events:
    get:
      operationId: listMyHostedEvents
      tags: [events]
      summary: My hosted events
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "401":
          description: Unauthorized

  /my/stats:
    get:
      operationId: getMyStats
      tags: [users]
      summary: My activity stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"
        "401":
          description: Unauthorized

  /my/connections:
    get:
      operationId: getMyConnections
      tags: [users]
      summary: People I have met at events
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        "401":
          description: Unauthorized

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: My notifications
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          description: Unauthorized

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications read
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized

  /feedbacks:
    post:
      operationId: submitFeedback
      tags: [feedbacks]
      summary: Submit feedback to office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Submitted
        "401":
          description: Unauthorized

  /office/kpi:
    get:
      operationId: getOfficeKpi
      tags: [office]
      summary: KPI dashboard (office only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeKpi"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /office/feedbacks:
    get:
      operationId: listOfficeFeedbacks
      tags: [office]
      summary: List feedbacks (office only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /office/export/events:
    get:
      operationId: exportEventsCSV
      tags: [office]
      summary: Export events as CSV (office only)
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        role:
          type: string
        interestTags:
          type: array
          items:
            type: string
        profileComplete:
          type: boolean
        createdAt:
          type: string
      required: [id, clerkUserId, email, role, interestTags, profileComplete, createdAt]

    UserProfileUpdate:
      type: object
      properties:
        name:
          type: string
        department:
          type: string
        interestTags:
          type: array
          items:
            type: string
        role:
          type: string

    UserStats:
      type: object
      properties:
        participated:
          type: integer
        hosted:
          type: integer
        connections:
          type: integer
      required: [participated, hosted, connections]

    Connection:
      type: object
      properties:
        id:
          type: integer
        name:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        metAtEventId:
          type: integer
        metAtEventTheme:
          type: string
      required: [id, metAtEventId, metAtEventTheme]

    Event:
      type: object
      properties:
        id:
          type: integer
        theme:
          type: string
        subTheme:
          type: ["string", "null"]
        datetime:
          type: string
        durationMinutes:
          type: integer
        location:
          type: string
        locationUrl:
          type: ["string", "null"]
        fee:
          type: integer
        capacity:
          type: integer
        minParticipants:
          type: integer
        deadline:
          type: string
        notes:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        hostId:
          type: integer
        hostName:
          type: ["string", "null"]
        hostDepartment:
          type: ["string", "null"]
        participantsCount:
          type: integer
        remainingSeats:
          type: integer
        status:
          type: string
          enum: [募集中, 実施確定, 未実施, 開催済]
        isApplied:
          type: boolean
        isHost:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - theme
        - datetime
        - durationMinutes
        - location
        - fee
        - capacity
        - minParticipants
        - deadline
        - tags
        - hostId
        - participantsCount
        - remainingSeats
        - status
        - isApplied
        - isHost
        - createdAt

    EventInput:
      type: object
      properties:
        theme:
          type: string
          minLength: 1
        subTheme:
          type: string
        datetime:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 120
        location:
          type: string
          minLength: 1
        locationUrl:
          type: string
        fee:
          type: integer
          minimum: 0
          maximum: 5000
        capacity:
          type: integer
          minimum: 3
          maximum: 6
        minParticipants:
          type: integer
          minimum: 2
          maximum: 6
        deadline:
          type: string
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - theme
        - datetime
        - durationMinutes
        - location
        - fee
        - capacity
        - minParticipants
        - deadline
        - tags

    EventUpdate:
      type: object
      properties:
        theme:
          type: string
        subTheme:
          type: string
        datetime:
          type: string
        durationMinutes:
          type: integer
        location:
          type: string
        locationUrl:
          type: string
        fee:
          type: integer
        capacity:
          type: integer
        minParticipants:
          type: integer
        deadline:
          type: string
        notes:
          type: string
        tags:
          type: array
          items:
            type: string

    Participation:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        userId:
          type: integer
        status:
          type: string
        comment:
          type: ["string", "null"]
        appliedAt:
          type: string
      required: [id, eventId, userId, status, appliedAt]

    ParticipantInfo:
      type: object
      properties:
        userId:
          type: integer
        name:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        comment:
          type: ["string", "null"]
        appliedAt:
          type: string
      required: [userId, appliedAt]

    ApplicationWithEvent:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        status:
          type: string
        comment:
          type: ["string", "null"]
        appliedAt:
          type: string
        event:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Event"
      required: [id, eventId, status, appliedAt]

    Report:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        authorId:
          type: integer
        authorName:
          type: ["string", "null"]
        type:
          type: string
          enum: [参加者感想, 開催者報告]
        content:
          type: string
        photoUrl:
          type: ["string", "null"]
        likesCount:
          type: integer
        isLiked:
          type: boolean
        createdAt:
          type: string
      required: [id, eventId, authorId, type, content, likesCount, isLiked, createdAt]

    ReportInput:
      type: object
      properties:
        type:
          type: string
          enum: [参加者感想, 開催者報告]
        content:
          type: string
          minLength: 1
        photoUrl:
          type: string
      required: [type, content]

    LikeResult:
      type: object
      properties:
        liked:
          type: boolean
        likesCount:
          type: integer
      required: [liked, likesCount]

    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        content:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
      required: [id, type, content, isRead, createdAt]

    FeedbackInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        eventId:
          type: integer
      required: [content]

    FeedbackItem:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        fromUserName:
          type: ["string", "null"]
        fromUserEmail:
          type: string
        eventId:
          type: ["integer", "null"]
        eventTheme:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, content, fromUserEmail, createdAt]

    OfficeKpi:
      type: object
      properties:
        totalEvents:
          type: integer
        completedEvents:
          type: integer
        cancelledEvents:
          type: integer
        eventsThisMonth:
          type: integer
        totalParticipants:
          type: integer
        participantsThisMonth:
          type: integer
        totalConnectionPairs:
          type: integer
        totalFeedbacks:
          type: integer
        topTags:
          type: array
          items:
            type: object
            properties:
              tag:
                type: string
              count:
                type: integer
            required: [tag, count]
      required:
        - totalEvents
        - completedEvents
        - cancelledEvents
        - eventsThisMonth
        - totalParticipants
        - participantsThisMonth
        - totalConnectionPairs
        - totalFeedbacks
        - topTags
