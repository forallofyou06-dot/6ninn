<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>偶然の6人</title>
    <script>
      // GitHub Pages has no SPA fallback. Preserve the route in a query string,
      // then index.html restores it before React starts.
      (function (location) {
        var segmentsToKeep = 1;
        var root = location.pathname.split("/").slice(0, 1 + segmentsToKeep).join("/");
        var route = location.pathname.slice(1).split("/").slice(segmentsToKeep).join("/");
        location.replace(
          location.protocol + "//" + location.host + root + "/?/" +
          route.replace(/&/g, "~and~") +
          (location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "") +
          location.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
